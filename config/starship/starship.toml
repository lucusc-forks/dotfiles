# Starship Prompt Configuration
# Styled to match previous Powerlevel10k "pure/lean" config
# Two-line prompt: segments on line 1, ❯ on line 2
# No background colors — transparent, space-separated segments

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$dotnet\
$docker_context\
$cmd_duration\
$jobs\
$status\
$line_break\
$character"""

add_newline = false
scan_timeout = 100

[os]
disabled = false
style = "bold"
[os.symbols]
Macos = " "
Linux = " "
Windows = "󰍲 "

[directory]
style = "bold 39"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Development" = "󰲋 "
"code" = "󰲋 "

[git_branch]
symbol = " "
style = "76"
format = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 32
truncation_symbol = "…"

[git_status]
style = ""
format = "[$all_status$ahead_behind]($style)"
ahead = "[⇡$count](76) "
behind = "[⇣$count](76) "
diverged = "[⇣$behind_count⇡$ahead_count](76) "
conflicted = "[~$count](196) "
staged = "[+$count](178) "
modified = "[!$count](178) "
untracked = "[?$count](39) "
stashed = "[*$count](76) "
deleted = "[✘$count](196) "
renamed = "[»$count](178) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".node-version"]

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version )]($style)"

[dotnet]
symbol = "󰪮 "
style = "blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 3_000
show_milliseconds = false
style = "101"
format = "[$duration]($style) "

[jobs]
style = "70"
symbol = "✱"
format = "[$symbol]($style) "

[fill]
symbol = " "

[status]
disabled = false
symbol = "✘ "
success_symbol = ""
style = "160"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](76)"
error_symbol = "[❯](196)"
