# Starship Prompt Configuration — Catppuccin Mocha

# Catppuccin Mocha palette reference:
# rosewater = "#f5e0dc"  flamingo = "#f2cdcd"  pink = "#f5c2e7"
# mauve = "#cba6f7"      red = "#f38ba8"       maroon = "#eba0ac"
# peach = "#fab387"      yellow = "#f9e2af"    green = "#a6e3a1"
# teal = "#94e2d5"       sky = "#89dceb"       sapphire = "#74c7ec"
# blue = "#89b4fa"       lavender = "#b4befe"  text = "#cdd6f4"
# subtext1 = "#bac2de"   subtext0 = "#a6adc8"  overlay2 = "#9399b2"
# overlay1 = "#7f849c"   overlay0 = "#6c7086"  surface2 = "#585b70"
# surface1 = "#45475a"   surface0 = "#313244"  base = "#1e1e2e"
# mantle = "#181825"     crust = "#11111b"

format = """
[](blue)\
$os\
$username\
[](bg:sapphire fg:blue)\
$directory\
[](fg:sapphire bg:green)\
$git_branch\
$git_status\
[](fg:green bg:peach)\
$nodejs\
$python\
$dotnet\
[](fg:peach bg:surface1)\
$docker_context\
$cmd_duration\
[](fg:surface1)\
$fill\
$status\
$line_break\
$character"""

[os]
disabled = false
style = "bg:blue fg:crust"
[os.symbols]
Macos = " "
Linux = " "
Windows = "󰍲 "

[username]
show_always = false
style_user = "bg:blue fg:crust"
style_root = "bg:red fg:crust"
format = "[$user ]($style)"

[directory]
style = "bg:sapphire fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Development" = "󰲋 "
"code" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:green fg:crust"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
symbol = ""
style = "bg:peach fg:crust"
format = "[ $symbol ($version) ]($style)"
detect_files = ["package.json", ".node-version"]

[python]
symbol = ""
style = "bg:peach fg:crust"
format = "[ $symbol ($version) ]($style)"

[dotnet]
symbol = "󰪮"
style = "bg:peach fg:crust"
format = "[ $symbol ($version) ]($style)"

[docker_context]
symbol = ""
style = "bg:surface1 fg:text"
format = "[ $symbol $context ]($style)"

[cmd_duration]
min_time = 2_000
style = "bg:surface1 fg:text"
format = "[ 󱎫 $duration ]($style)"

[fill]
symbol = " "

[status]
disabled = false
symbol = "✘"
success_symbol = ""
format = "[$symbol$status ]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
